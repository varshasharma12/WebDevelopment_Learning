<!DOCTYPE html>
<html lang="en"
<head>
    <meta charset="UTF-8"
    <meta name="viewport" content="width=\,initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Internship Registration Form</h1>
    <from action="/register" method="post">
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullName" placeholder="Enter Name....">
        <br>
        <label for="email">Email:</label>
        <input type="text" id="email" placeholder="Enter Mail..."> <br>
        <label for="phone">Phone Number</label>
        <input type="number" id="Phone Number" placeholder="Enter Phone Number..."> <br>
        <label for="dateofbirth">Date of Birth:</label>
        <input type="date" name="dateOfBirth" id="dateofBirth"> <br>
        <label for="password">Password:</label>
        <input type="password" name="password" id="password"> <br>
        <label for="Gender">Gender:</label>
        <label for="Male">Male:</label>
        <input type="radio" value="male" name="gender" id="male">
        <label for="female">Female:</label>
        <input type="radio" value="female" name="gender" id="female"> <br>
        <label for="branch">Branch:</label>
        <select name="branch" id="branch" required>
        <option value="">Select Branch</option>
        <option value="CSE">CSE</option>
        <option value="IT">IT</option>
        <option value="ECE">ECE</option>
        <option value="Mechanical">Mechanical</option>
        </select>
        <br>
        <label>Skills:</label> 
        <input type="checkbox" id="Java" value="Java">
        <label for="Java">Java:</label>
        <input type="checkbox" id="Javascript" value="Javascript">
        <label for="Javascript">Javascript:</label>
        <input type="checkbox" id="HTML" value="HTML">
        <label for="HTML">HTML:</label>
        <input type="checkbox" id="CSS" value="CSS">
        <label for="CSS">CSS:</label>
        <input type="checkbox" id="react" value="react">
        <label for="react">react:</label>  <br>
        <label for="Internship Preference">Internship Preference</label>
        <input type="radio" id="web" value="web">
        <label for="Web">Web Development:</label>
        <input type="radio" id="Cloud" value="web">
        <label for="cloud">Cloud Computing:</label>
        <input type="radio" id="DevOps" value="web">
        <label for="DevOps">DevOps:</label>   <br>
        <label>Upload Resume:</label>
        <input type="File">    <br>
        <label for="cover">Cover Letter:</label>  
        <textarea id="cover" name="cover" rows="5" cols="40" placeholder="Write your cover letter here..."></textarea>
<br><br>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
        
       

<body>
<html>
