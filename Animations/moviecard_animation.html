    <title>Document</title>
    <style>
        .cards-container{
            display:grid;
            grid-template-columns: repeat(3, 300px);
            grid-template-rows: repeat(3, 300px);
            background-color:aliceblue;
            font-family: sans-serif;
            gap:60px;
        }
        .movie-card{
            width:300px;
            border:1px solid;
            border-color:#e5e7eb;
            background-color:white;
            border-radius:16px;
            overflow:hiden;
            transition: all 0.2s;
            opacity:0;
            animation:CardAnimation 0.6s ease;
        }
        .movie-card:hover{
            transform: scaleY(1.1);
        }
        .movie-image img{
            width:100%;
            height:300px;
            object-fit:cover;
        }
        .movie-images img{
            width:100%;
            height:300px;
            object-fit:cover;
            display:block;
        }
        .movie-title{
            font-weight: 600;
        }
        .movie-info{
            padding:5px;
        }
        .movie-details{
            color:#545459;
        }
        @keyframes CardAnimation{
            from{
                opacity:0;
                transform:translateY(30px);
            }
            to{
                opacity:1;
                transform:translateY(0px);
            }
        }
        .movie-card:nth-child(1){
            animation-delay: (0.1s);
        }
        .movie-card:nth-child(2){
            animation-delay: (0.2s);
        }
        .movie-card:nth-child(3){
            animation-delay: (0.3s);
        }
    </style>
</head>
