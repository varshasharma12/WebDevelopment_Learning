<!DOCTYPE html>
<html lang="en">
<head>

    <title>Document</title>
    <style>
        *{

            padding:0;
            box-sizing:border-box;
        }
        body{
            font-family: Arial,Helvetica,sans-serif;

        nav{
            display:flex;
            justify-content:space-between;
            padding: 20px;
            background-color:#493d59;
            color:white;

        .nav-links a{

        }
        .login-button{

            height:50px;

        .food-cards{

            border-color:#ffffff;

            background-color:rgb(246,225,198);
            height:300px;
            width:300px;
            background-image:url(https://b.zmtcdn.com/data/reviews_photos/1b6/9e3b28e210f84f5b5b535b4526f091b6_1600159281.jpg);
        }

        </style>
</head>
<body>
    <nav>
        <div class="logo">

        </div>
        <div class="nav-links">
            <a href="">Home</a>
            <a href="">About</a>
            <a href="">Contact us</a>
            <a href="">Blogs</a>
            <div class="login-button">Login</div>
        </div>
        
    </nav>
    <div class="food-cards">
    </div>

</html>
